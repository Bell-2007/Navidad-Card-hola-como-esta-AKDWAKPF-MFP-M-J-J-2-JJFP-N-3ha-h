<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz Navidad, Camila</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #0b1622;
      --bg-mid: #132538;
      --crimson: #8b1e24;
      --crimson-dark: #5e1116;
      --gold: #d4af37;
      --gold-light: #f3d982;
      --cream: #fdf8f0;
      --paper: #fffdf9;
      --ink: #2b211e;
      --ink-soft: #5c4942;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, var(--bg-mid) 0%, var(--bg-deep) 75%);
      color: var(--cream);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
    }

    /* Nieve */
    #snow-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Controles superiores */
    .top-bar {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      pointer-events: none;
    }

    .pill-btn {
      pointer-events: auto;
      background: rgba(19, 37, 56, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(212, 175, 55, 0.45);
      color: var(--gold-light);
      padding: 8px 15px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .pill-btn:hover {
      background: rgba(212, 175, 55, 0.18);
      border-color: var(--gold-light);
      transform: translateY(-1px);
    }

    #music-control {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #music-control.visible {
      opacity: 1;
      visibility: visible;
    }

    /* Escena del sobre */
    #envelope-stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    #envelope-stage.hidden {
      opacity: 0;
      transform: scale(0.92) translateY(-20px);
      pointer-events: none;
      position: absolute;
    }

    .pre-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.3rem, 6vw, 3.4rem);
      color: var(--gold-light);
      text-shadow: 0 2px 14px rgba(212, 175, 55, 0.35);
      margin-bottom: 6px;
    }

    .pre-subtitle {
      font-size: 0.9rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(253, 248, 240, 0.78);
      margin-bottom: 32px;
    }

    .envelope-wrapper {
      position: relative;
      width: min(360px, 88vw);
      height: 235px;
      background: linear-gradient(145deg, var(--crimson), var(--crimson-dark));
      border-radius: 12px;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(212, 175, 55, 0.35);
      cursor: pointer;
      perspective: 1000px;
      transition: transform 0.35s ease;
    }

    .envelope-wrapper:hover {
      transform: translateY(-5px);
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 135px;
      background: linear-gradient(180deg, #9e232a 0%, #74161c 100%);
      clip-path: polygon(0 0, 50% 92%, 100% 0);
      transform-origin: top center;
      transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 4;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .envelope-wrapper.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope-pocket {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      border-radius: 12px;
      overflow: hidden;
    }

    .envelope-pocket::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, transparent 50%);
      clip-path: polygon(0 0, 52% 55%, 0 100%);
    }

    .envelope-pocket::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(225deg, rgba(0, 0, 0, 0.18) 0%, transparent 50%);
      clip-path: polygon(100% 0, 48% 55%, 100% 100%);
    }

    .envelope-bottom {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, #691318 0%, #871c22 100%);
      clip-path: polygon(0 100%, 50% 46%, 100% 100%);
      z-index: 3;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    .ribbon-v {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 24px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #b58d22, var(--gold-light), #b58d22);
      z-index: 3;
      opacity: 0.9;
      transition: opacity 0.4s ease;
    }

    .envelope-wrapper.open .ribbon-v {
      opacity: 0;
    }

    .wax-seal {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--gold-light), var(--gold) 65%, #9e7818 100%);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.6);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      color: var(--crimson-dark);
      transition: transform 0.35s ease, opacity 0.4s ease;
      animation: pulseSeal 2.4s infinite ease-in-out;
    }

    .envelope-wrapper.open .wax-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.6);
    }

    @keyframes pulseSeal {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.07); }
    }

    .tap-hint {
      margin-top: 22px;
      font-size: 0.86rem;
      color: var(--gold-light);
      opacity: 0.9;
    }

    /* Carta abierta */
    #letter-stage {
      position: relative;
      z-index: 15;
      width: min(680px, 95vw);
      opacity: 0;
      transform: translateY(30px) scale(0.96);
      pointer-events: none;
      transition: opacity 0.85s ease, transform 0.85s ease;
      margin: 46px auto 24px;
    }

    #letter-stage.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .letter-card {
      background: var(--paper);
      color: var(--ink);
      border-radius: 16px;
      padding: clamp(28px, 5vw, 50px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(212, 175, 55, 0.5);
      position: relative;
      overflow: hidden;
    }

    .letter-card::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 10px;
      pointer-events: none;
    }

    .letter-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .holiday-badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--crimson);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .letter-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.4rem, 6vw, 3.3rem);
      color: var(--crimson);
      line-height: 1.15;
    }

    .divider {
      width: 90px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 14px auto 0;
    }

    .letter-body {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.24rem, 2.7vw, 1.4rem);
      line-height: 1.75;
      color: var(--ink);
      white-space: pre-line;
      margin-bottom: 28px;
    }

    .letter-sign {
      font-family: 'Great Vibes', cursive;
      font-size: 2.1rem;
      color: var(--crimson);
      text-align: right;
      margin-bottom: 28px;
    }

    /* Botón "¡Tocame!" y sorpresa final */
    .surprise-box {
      border-top: 1px dashed rgba(212, 175, 55, 0.65);
      padding-top: 26px;
      text-align: center;
    }

    .touch-btn {
      background: linear-gradient(135deg, var(--crimson), var(--crimson-dark));
      color: var(--gold-light);
      border: 1px solid var(--gold);
      padding: 13px 34px;
      border-radius: 999px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(139, 30, 36, 0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .touch-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 28px rgba(139, 30, 36, 0.45);
    }

    .touch-btn:active {
      transform: scale(0.98);
    }

    .final-message {
      margin-top: 22px;
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.1rem, 5.5vw, 3rem);
      color: var(--crimson);
      opacity: 0;
      transform: translateY(12px) scale(0.95);
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.7s ease, transform 0.7s ease, max-height 0.7s ease;
      text-shadow: 0 2px 10px rgba(212, 175, 55, 0.35);
    }

    .final-message.revealed {
      opacity: 1;
      transform: translateY(0) scale(1);
      max-height: 160px;
    }

    /* Modal de personalización */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 12, 20, 0.78);
      backdrop-filter: blur(5px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #132538;
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 16px;
      width: min(500px, 95vw);
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      color: var(--cream);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .modal-box h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      color: var(--gold-light);
      margin-bottom: 14px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--gold-light);
      margin-bottom: 5px;
    }

    .field input,
    .field textarea {
      width: 100%;
      background: rgba(11, 22, 34, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--cream);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.88rem;
    }

    .field textarea {
      min-height: 135px;
      resize: vertical;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(253, 248, 240, 0.3);
      color: var(--cream);
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold), #b88f22);
      border: none;
      color: #1a120b;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="snow-canvas"></canvas>

  <!-- Archivo de audio: coloca tu MP3 en la misma carpeta con este nombre -->
  <audio id="love-song" preload="auto" loop>
    <source src="Jorge Cuellar - Mi gran amor.mp3" type="audio/mpeg" />
  </audio>

  <div class="top-bar">
    <button id="music-control" class="pill-btn" type="button" title="Pausar o reanudar música">
      <span id="music-icon">🎵</span>
      <span id="music-label">Sonando: Mi gran amor</span>
    </button>

    <button id="edit-btn" class="pill-btn" type="button">
      
    </button>
  </div>

  <!-- Escena 1: Sobre cerrado -->
  <main id="envelope-stage">
    <h1 class="pre-title" id="cover-title">Para mi esposa</h1>
    <p class="pre-subtitle">Un detalle especial esta Navidad</p>

    <div class="envelope-wrapper" id="envelope" role="button" tabindex="0" aria-label="Abrir sobre navideño">
      <div class="envelope-flap"></div>
      <div class="envelope-pocket"></div>
      <div class="envelope-bottom"></div>
      <div class="ribbon-v"></div>
      <div class="wax-seal">❤</div>
    </div>

    <p class="tap-hint">Toca el sello dorado para abrir tu regalo</p>
  </main>

  <!-- Escena 2: Carta abierta -->
  <section id="letter-stage" aria-live="polite">
    <article class="letter-card">
      <header class="letter-header">
        <span class="holiday-badge">Feliz Navidad ✦ Con todo mi amor</span>
        <h2 class="letter-title" id="letter-heading">Para el amor de mi vida</h2>
        <div class="divider"></div>
      </header>

      <div class="letter-body" id="letter-content"></div>

      <div class="letter-sign" id="letter-signature">Siempre tuyo</div>

      <div class="surprise-box">
        <button type="button" class="touch-btn" id="touch-btn">¡Tocame!</button>
        <div class="final-message" id="final-message">Te amo Camila, feliz navidad ❤️</div>
      </div>
    </article>
  </section>

  <!-- Modal para personalizar textos -->
  <div class="modal-backdrop" id="modal">
    <div class="modal-box">
      <h3>Personalizar carta</h3>

      <div class="field">
        <label for="in-title">Título para ella</label>
        <input id="in-title" type="text" />
      </div>

      <div class="field">
        <label for="in-body">Tu mensaje navideño</label>
        <textarea id="in-body"></textarea>
      </div>

      <div class="field">
        <label for="in-sign">Tu firma</label>
        <input id="in-sign" type="text" />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-modal">Cancelar</button>
        <button type="button" class="btn-primary" id="save-modal">Guardar cambios</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'navidad_camila_v1';

    const defaultData = {
      title: 'Para el amor de mi vida',
      body: `Amor de mi vida,\n\nQuerido amor mio, no puedo explicar como me siento contigo, mi amor por ti crece siempre por ti, esta navidad no podre estar a tu lado pero solo quiero hacerte saber que tu eres mi regalo que no llego hoy, Te amo.\n\nRecuerda mi amor siempre seré tuyo aunque me odies o nos pase algo, eres la unica que me enseño el amor verdadero, eres lo mas lindo que me toco tener en toda mi vida`,
      signature: 'Con todo mi amor, Bell, Para mi gran amor'
    };

    let cardData = loadData();
    let isOpened = false;

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? { ...defaultData, ...JSON.parse(raw) } : structuredClone(defaultData);
      } catch {
        return structuredClone(defaultData);
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cardData));
    }

    function renderCard() {
      document.getElementById('cover-title').textContent = cardData.title;
      document.getElementById('letter-heading').textContent = cardData.title;
      document.getElementById('letter-content').textContent = cardData.body;
      document.getElementById('letter-signature').textContent = cardData.signature;
    }

    // Audio: SOLO suena al abrir el sobre
    const song = document.getElementById('love-song');
    const musicControl = document.getElementById('music-control');
    const musicIcon = document.getElementById('music-icon');
    const musicLabel = document.getElementById('music-label');

    function updateMusicUI() {
      if (song.paused) {
        musicIcon.textContent = '▶️';
        musicLabel.textContent = 'Reanudar canción';
      } else {
        musicIcon.textContent = '🎵';
        musicLabel.textContent = 'Sonando: Mi gran amor';
      }
    }

    musicControl.addEventListener('click', () => {
      if (song.paused) {
        song.play().then(updateMusicUI).catch(() => {});
      } else {
        song.pause();
        updateMusicUI();
      }
    });

    // Abrir el sobre
    const envelope = document.getElementById('envelope');
    const envelopeStage = document.getElementById('envelope-stage');
    const letterStage = document.getElementById('letter-stage');

    function openEnvelope() {
      if (isOpened) return;
      isOpened = true;

      envelope.classList.add('open');

      song.currentTime = 0;
      song.play()
        .then(() => {
          musicControl.classList.add('visible');
          updateMusicUI();
        })
        .catch(() => {
          musicControl.classList.add('visible');
          updateMusicUI();
        });

      setTimeout(() => {
        envelopeStage.classList.add('hidden');
        letterStage.classList.add('visible');
      }, 750);
    }

    envelope.addEventListener('click', openEnvelope);
    envelope.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openEnvelope();
      }
    });

    // Botón "¡Tocame!"
    const touchBtn = document.getElementById('touch-btn');
    const finalMessage = document.getElementById('final-message');

    touchBtn.addEventListener('click', () => {
      finalMessage.classList.add('revealed');
    });

    // Modal de edición
    const modal = document.getElementById('modal');
    document.getElementById('edit-btn').addEventListener('click', () => {
      document.getElementById('in-title').value = cardData.title;
      document.getElementById('in-body').value = cardData.body;
      document.getElementById('in-sign').value = cardData.signature;
      modal.classList.add('open');
    });

    document.getElementById('cancel-modal').addEventListener('click', () => {
      modal.classList.remove('open');
    });

    document.getElementById('save-modal').addEventListener('click', () => {
      cardData.title = document.getElementById('in-title').value.trim() || defaultData.title;
      cardData.body = document.getElementById('in-body').value.trim() || defaultData.body;
      cardData.signature = document.getElementById('in-sign').value.trim() || defaultData.signature;

      saveData();
      renderCard();
      modal.classList.remove('open');
    });

    // Efecto de nieve suave
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const flakes = Array.from({ length: 75 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 2.6 + 0.8,
      speedY: Math.random() * 0.9 + 0.35,
      speedX: (Math.random() - 0.5) * 0.4,
      opacity: Math.random() * 0.65 + 0.25
    }));

    function animateSnow() {
      ctx.clearRect(0, 0, width, height);
      for (const f of flakes) {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 250, 240, ${f.opacity})`;
        ctx.fill();

        f.y += f.speedY;
        f.x += f.speedX;

        if (f.y > height) {
          f.y = -5;
          f.x = Math.random() * width;
        }
        if (f.x > width) f.x = 0;
        if (f.x < 0) f.x = width;
      }
      requestAnimationFrame(animateSnow);
    }

    renderCard();
    animateSnow();
  </script>
</body>
</html>
